name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check django_libsql/
      - run: ruff format --check django_libsql/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install Django
      - run: pip install -e .
      - run: python -c "import django_libsql; print(django_libsql.__version__)"
      - run: python -c "from django_libsql.base import DatabaseWrapper; print('Import OK')"
